services:
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: nimagents-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-}"
    volumes:
      - nimagents_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7700/health"]
      interval: 5s
      timeout: 2s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: nimagents-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - nimagents_qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: nimagents-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - nimagents_minio_data:/data

volumes:
  nimagents_meili_data:
  nimagents_qdrant_data:
  nimagents_minio_data:
